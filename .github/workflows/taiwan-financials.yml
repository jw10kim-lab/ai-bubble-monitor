name: Taiwan quarterly financials
on:
  workflow_dispatch:
  schedule:
    - cron: '0 23 * * 4'
permissions:
  contents: write
concurrency:
  group: taiwan-financials
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.PAGES_UPDATE_TOKEN || github.token }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install parsers
        run: python -m pip install requests==2.32.5 beautifulsoup4==4.14.3
      - name: Validate parser
        run: python scripts/update_taiwan_financials.py --self-test
      - name: Collect TWSE and MOPS financial reports
        run: python scripts/update_taiwan_financials.py
      - name: Commit verified data only
        run: |
          if git diff --quiet -- data.json; then
            echo "No financial data changes"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data.json
          git commit -m "Update Taiwan quarterly financials from MOPS"
          git push origin HEAD:main
