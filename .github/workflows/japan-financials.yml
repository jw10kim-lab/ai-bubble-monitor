name: Japan quarterly financials
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/update_japan_financials.py'
      - '.github/workflows/japan-financials.yml'
  schedule:
    - cron: '0 23 * * 3'
permissions:
  contents: write
concurrency:
  group: kr-jp-financials
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.PAGES_UPDATE_TOKEN || github.token }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install HTTP client
        run: python -m pip install requests==2.32.5
      - name: Validate parser
        run: |
          python -m py_compile scripts/update_japan_financials.py
          python scripts/update_japan_financials.py --self-test
      - name: Collect official filings
        env:
          EDINET_API_KEY: ${{ secrets.EDINET_API_KEY }}
        run: python scripts/update_japan_financials.py
      - name: Retain collection diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: japan-collection-report
          path: japan-collection-report.json
          if-no-files-found: ignore
      - name: Commit verified data only
        run: |
          if git diff --quiet -- data.json; then
            echo "No financial data changes"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data.json
          git commit -m "Update japan quarterly official financial data"
          git push origin HEAD:main
